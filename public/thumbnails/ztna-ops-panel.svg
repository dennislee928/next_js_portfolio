    <text x="88" y="196" font-size="26" font-weight="600" letter-spacing="3.4" fill="#8b5cf6" fill-opacity="0.92">CLOUDFLARE ACCESS</text>
    <text font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1"><tspan x="88" y="360">Zero Trust Ops Panel</tspan></text>
    <text x="88" y="454" font-size="28" fill="#9aa0c3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">panel.dennisleehappy.org</text>
  </g>

  <rect x="0" y="792" width="1280" height="8" fill="#8b5cf6" fill-opacity="0.5"/>
